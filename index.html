            return targetApp.firestore(firebaseConfig.firestoreDatabaseId);

            const questions = [

            const handleAnswer = (idx) => {

                setStep(step + 1);
            };

            const getIQResult = () => {

                    const fetchedPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Sort client-side by createdAt desc
                    fetchedPosts.sort((a, b) => {
                        const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
                        const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
                        return dateB - dateA;

                    setLoadingPosts(false);
                    setError(null);

                    setLoadingPosts(false);

                const uploadTask = storageRef.put(file);

                return new Promise((resolve, reject) => {
                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            setUploadProgress(progress);
                        }, 
                        (error) => {
                            console.error("Upload error:", error);
                            setIsUploading(false);
                            setError("Ошибка загрузки файла: " + error.message);
                            reject(error);

                        async () => {
                            const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();

                                                        {t === 'audio' && <Icons.Music className="w-4 h-4 mx-auto mb-1" />}
                                                        {t}
                                                    </button>
                                                ))}

                                            </div>
                                        </form>
                                    </AnimatedBlock>
                                )}
                            </div>

                                        setIsPlaying(true);

                        }
                    }, 500);

                    ) : currentPage === 'test' ? (

                                <a href="https://www.youtube.com/@Воваааанчик" target="_blank" className="text-white/40 hover:text-white transition-colors"><Icons.Youtube className="w-4 h-4" /></a>

                    {/* Elfsight Comments Widget - Main Page Bottom */}
                    <div className="max-w-4xl mx-auto mt-10 mb-20 px-0 sm:px-6">

                            <h2 className="text-2xl md:text-3xl font-black tracking-tighter text-center uppercase">ОБСУЖДЕНИЕ</h2>
                            <div className="h-px bg-white/10 flex-1"></div>
                        </div>
                        <div className="community-container">
                            <div className="elfsight-app-280aa841-19d0-4572-a294-30d5bb640777" data-elfsight-app-lazy></div>
                        </div>
                    </div>

                    {/* Elfsight AI Chatbot - Global (Grigory Assistant) */}
                    <div className="elfsight-app-85e906d9-ec70-4899-8c6b-32409f5caf52" data-elfsight-app-lazy></div>

                    {/* Elfsight Cookie Consent */}
                    <div className="elfsight-app-0d44ffc6-0a43-4e01-9da6-441185ae08b1" data-elfsight-app-lazy></div>
                </div>
            );
        };

        // Final cleanup script for Elfsight branding and Cookie Logic
        // Absolute Nuclear Branding Cleanup
        // THE FINAL BRANDING EXTERMINATOR
        const exterminate = () => {
            const process = (node) => {
                if (!node) return;

                // 1. Surgical Deletion & Sanitization
                if (node.tagName === 'A') {
                    const href = node.getAttribute('href') || "";
                    const text = (node.innerText || "").toLowerCase();
                    if (href.includes('elfsight') || text.includes('elfsight') || text.includes('chatbot widget') || text.includes('free ai')) {
                        node.style.display = 'none';
                        node.style.opacity = '0';
                        node.style.pointerEvents = 'none';
                        node.remove();
                    }
                }

                // 2. Hide common branding classes
                if (node.classList) {
                    const blacklist = ['branding', 'Branding', 'Badge', 'badge', 'copyright', 'eapps-link', 'Link'];
                    blacklist.forEach(cls => {
                        if (node.className && typeof node.className === 'string' && node.className.includes(cls)) {
                            node.style.setProperty('display', 'none', 'important');
                            node.style.setProperty('opacity', '0', 'important');
                        }
                    });
                }

                // 3. SHADOW DOM STALKER - Inject styles into EVERY shadow root
                if (node.shadowRoot) {
                    if (!node.shadowRoot.querySelector('#branding-stalker-style')) {
                        const style = document.createElement('style');
                        style.id = 'branding-stalker-style';
                        style.textContent = `
                            a[href*="elfsight"], .eapps-link, [class*="branding"], [class*="Branding"], [class*="Badge"], [class*="badge"], [class*="copyright"], [class*="Link"] { 
                                display: none !important; 
                                opacity: 0 !important; 
                                visibility: hidden !important; 
                                height: 0 !important;
                                width: 0 !important;
                                pointer-events: none !important;
                                position: absolute !important;
                                left: -9999px !important;
                            }
                        `;
                        node.shadowRoot.appendChild(style);
                    }
                    process(node.shadowRoot);
                }

                // 4. Recurse children
                if (node.children) {
                    Array.from(node.children).forEach(child => process(child));
                }
            };

            process(document.body);

            // 5. UPDATE PHYSICAL "ZAMAZKA" SHIELD
            const chatbot = document.querySelector('[class*="Chatbot"], [class*="chatbot"]');
            if (chatbot) {
                let shield = document.getElementById('ultimate-branding-shield');
                if (!shield) {
                    shield = document.createElement('div');
                    shield.id = 'ultimate-branding-shield';
                    document.body.appendChild(shield);
                }

                const rect = chatbot.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 100) {
                    shield.style.display = 'block';
                    shield.style.width = (rect.width - 2) + 'px';
                    shield.style.left = (rect.left + 1) + 'px';
                    shield.style.bottom = (window.innerHeight - rect.bottom + 1) + 'px';
                } else {
                    shield.style.display = 'none';
                }
            }
        };

        const monitorBranding = () => {
            exterminate();
            requestAnimationFrame(monitorBranding);
        };
        monitorBranding();

        // Separate Cookie Logic
        const handleCookieLogic = () => {
            const buttons = document.querySelectorAll('button, [class*="Button"]');
            buttons.forEach(btn => {
                const text = btn.innerText.toLowerCase();
                if (text.includes('продолжить без cookie') && !btn.dataset.hooked) {
                    btn.addEventListener('click', () => {
                        localStorage.removeItem('cookies_accepted');
                        Object.keys(localStorage).forEach(key => { if (key.includes('0d44ffc6')) localStorage.removeItem(key); });
                    });
                    btn.dataset.hooked = 'true';
                }
                if (text.includes('разрешить') && !btn.dataset.hooked) {
                    btn.addEventListener('click', () => localStorage.setItem('cookies_accepted', 'true'));
                    btn.dataset.hooked = 'true';
                }
            });
        };
        setInterval(handleCookieLogic, 2000);
        handleCookieLogic();

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
